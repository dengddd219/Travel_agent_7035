<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amap UI Demo</title>
    <link rel="stylesheet" href="./map.css" />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eef4f7;
      }
      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        height: 100vh;
      }
      .sidebar {
        padding: 20px;
        background: #ffffff;
        border-right: 1px solid #d8e2ea;
        overflow: auto;
      }
      #map-container {
        width: 100%;
        height: 100%;
      }
      button {
        padding: 10px 14px;
        border: 0;
        border-radius: 10px;
        background: #0f8ea8;
        color: #fff;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f6f8fb;
        padding: 12px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="sidebar">
        <h2>Amap UI Demo</h2>
        <p>Use the bundled mock payload to verify the map renderer visually.</p>
        <button id="render-btn">Render Mock Route</button>
        <h3>Payload preview</h3>
        <pre id="payload-preview"></pre>
      </div>
      <div id="map-container"></div>
    </div>
    <script src="./amap-env.js"></script>
    <script src="./map.js"></script>
    <script src="./mock_map_payload.js"></script>
    <script>
      document.getElementById("payload-preview").textContent =
        JSON.stringify(window.mockMapPayload, null, 2);
      document.getElementById("render-btn").addEventListener("click", function () {
        window.renderTravelMap(window.mockMapPayload, {
          containerId: "map-container",
          city: "成都"
        });
      });
    </script>
  </body>
  </html>
