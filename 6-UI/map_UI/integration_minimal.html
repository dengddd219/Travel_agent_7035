<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMap Minimal Integration</title>
    <link rel="stylesheet" href="./map.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f4f7f8;
      }

      .integration-shell {
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .integration-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      }

      .integration-title {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        color: #102033;
      }

      .integration-hint {
        margin: 0;
        color: #667085;
        font-size: 13px;
      }

      .integration-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      #map-container {
        width: 100%;
        height: 100%;
      }

      #map-status {
        position: fixed;
        left: 18px;
        bottom: 18px;
        max-width: min(560px, calc(100vw - 36px));
        z-index: 10;
        margin: 0;
        box-shadow: 0 14px 28px rgba(15, 23, 42, 0.14);
      }
    </style>
    <script src="./amap-env.js"></script>
    <script>
      (function loadAmapSdk() {
        var key = window.AMAP_JS_API_KEY;
        if (!key || key === "YOUR_AMAP_JS_API_KEY") {
          window.__AMAP_MINIMAL_ERROR__ = "未读取到高德 JS API Key。";
          return;
        }

        var script = document.createElement("script");
        script.src =
          "https://webapi.amap.com/maps?v=2.0&key=" +
          encodeURIComponent(key) +
          "&plugin=AMap.Scale,AMap.ToolBar,AMap.Walking,AMap.Driving,AMap.Transfer";
        script.async = true;
        script.onerror = function () {
          window.__AMAP_MINIMAL_ERROR__ = "高德 JS SDK 加载失败，请检查 Key、securityJsCode 或域名白名单。";
        };
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <main class="integration-shell">
      <header class="integration-header">
        <div>
          <h1 class="integration-title">地图组件正式接入示例</h1>
          <p class="integration-hint">正式页面只需要容器、SDK、map.js 和 renderTravelMap(data.map_payload)。</p>
        </div>
        <div id="route-mode-controls" class="integration-actions"></div>
      </header>

      <section id="map-container"></section>
    </main>

    <div id="map-status" class="status-box">地图准备中。</div>

    <script src="./mock_map_payload.js"></script>
    <script src="./map.js"></script>
    <script>
      function bootMinimalIntegration() {
        var status = document.getElementById("map-status");

        if (window.__AMAP_MINIMAL_ERROR__) {
          status.textContent = window.__AMAP_MINIMAL_ERROR__;
          status.style.background = "rgba(239, 68, 68, 0.12)";
          status.style.color = "#991b1b";
          return;
        }

        if (!window.AMap || !window.renderTravelMap || !window.mockMapPayload) {
          window.setTimeout(bootMinimalIntegration, 200);
          return;
        }

        window.renderTravelMap(window.mockMapPayload, {
          containerId: "map-container",
          city: "上海",
          modeSelector: "#route-mode-controls",
          statusSelector: "#map-status"
        });
      }

      bootMinimalIntegration();
    </script>
  </body>
</html>
