<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 旅行规划助手</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f4f8;
      --nav-bg: #ffffff;
      --chat-bg: #ffffff;
      --map-bg: #f4f7f8;
      --user-bubble: #CDB3FF70;
      --ai-bubble: #f4f6f8;
      --border: rgba(15, 23, 42, 0.08);
      --accent: #7c3aed;
      --accent-light: #ede9fe;
      --text-main: #102033;
      --text-muted: #64748b;
      --send-bg: #7c3aed;
      --shadow: 0 4px 24px rgba(15,23,42,0.08);
    }

    html, body {
      height: 100%;
      font-family: "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      overflow: hidden;
    }

    /* ── Top Nav ── */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      z-index: 100;
      box-shadow: 0 1px 8px rgba(15,23,42,0.06);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
      color: var(--accent);
      text-decoration: none;
    }

    .nav-logo-icon {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      color: #fff;
    }

    .nav-title { font-size: 14px; color: var(--text-muted); margin-left: 4px; }

    .nav-spacer { flex: 1; }

    .nav-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: var(--accent-light); color: var(--accent); }

    /* ── Main Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      height: calc(100vh - 52px);
      margin-top: 52px;
    }

    /* ── Left: Chat Panel ── */
    .chat-panel {
      background: var(--chat-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .chat-header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .chat-header-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-header-title .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 2px rgba(34,197,94,0.25);
    }

    .chat-header-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Message List */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    /* Message bubbles */
    .msg-row {
      display: flex;
      gap: 8px;
      max-width: 100%;
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }

    .msg-row.assistant .msg-avatar {
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      color: #fff;
    }

    .msg-row.user .msg-avatar {
      background: #e5e7eb;
      color: #374151;
    }

    .msg-bubble {
      max-width: calc(100% - 48px);
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
    }

    .msg-row.user .msg-bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      color: var(--text-main);
    }

    .msg-row.assistant .msg-bubble {
      background: var(--ai-bubble);
      border-bottom-left-radius: 4px;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .msg-bubble p { margin-bottom: 6px; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble strong { color: var(--accent); }
    .msg-bubble ul { padding-left: 16px; }
    .msg-bubble li { margin-bottom: 4px; }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Suggestion chips */
    .suggestions {
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex-shrink: 0;
    }

    .suggestion-chip {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(124, 58, 237, 0.3);
      background: var(--accent-light);
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .suggestion-chip:hover {
      background: var(--accent);
      color: #fff;
    }

    /* Input area */
    .input-area {
      padding: 10px 12px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-box {
      flex: 1;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-main);
      resize: none;
      outline: none;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }
    .input-box:focus { border-color: var(--accent); }
    .input-box::placeholder { color: #94a3b8; }

    .send-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--send-bg);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .send-btn:hover { background: #6d28d9; }
    .send-btn:active { transform: scale(0.94); }
    .send-btn svg { width: 16px; height: 16px; fill: #fff; }

    .input-hint {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 6px;
      text-align: center;
    }

    /* ── Right: Map Panel ── */
    .map-panel {
      position: relative;
      background: var(--map-bg);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .map-toolbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      z-index: 10;
    }

    .map-toolbar-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .map-toolbar-spacer { flex: 1; }

    #route-mode-controls {
      display: flex;
      gap: 6px;
    }

    /* map.js 生成的 route-mode 按钮样式覆盖 */
    #route-mode-controls button {
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    #route-mode-controls button:hover,
    #route-mode-controls button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    #map-container {
      width: 100%;
      height: 100%;
      padding-top: 44px;
    }

    /* map.js 内置地图容器需要撑满 */
    #map-container > .amap-maps,
    #map-container > div {
      height: 100% !important;
    }

    #map-status {
      position: absolute;
      left: 14px;
      bottom: 14px;
      max-width: min(420px, calc(100% - 28px));
      z-index: 10;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      box-shadow: var(--shadow);
      pointer-events: none;
    }

    /* map.css 里的 status-box 相关 */
    .status-box {
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Map placeholder when no data */
    .map-placeholder {
      position: absolute;
      inset: 44px 0 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
      background: linear-gradient(135deg, #f0f4ff 0%, #f4f0ff 100%);
      z-index: 5;
      transition: opacity 0.4s;
    }

    .map-placeholder.hidden { opacity: 0; pointer-events: none; }

    .map-placeholder-icon {
      font-size: 48px;
      opacity: 0.35;
    }

    .map-placeholder-text {
      text-align: center;
      max-width: 220px;
      line-height: 1.5;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .chat-panel { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>

  <!-- 高德地图安全密钥（必须在 SDK 加载前） -->
  <script src="./map_UI/amap-env.js"></script>
  <!-- 高德地图 JS SDK -->
  <script>
    (function loadAmapSdk() {
      var key = window.AMAP_JS_API_KEY;
      if (!key || key === "YOUR_AMAP_JS_API_KEY") {
        window.__AMAP_LOAD_ERROR__ = "未读取到高德 JS API Key，地图无法显示。";
        return;
      }
      var s = document.createElement("script");
      s.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(key) +
              "&plugin=AMap.Scale,AMap.ToolBar,AMap.Walking,AMap.Driving,AMap.Transfer";
      s.async = true;
      s.onerror = function () {
        window.__AMAP_LOAD_ERROR__ = "高德 JS SDK 加载失败，请检查 Key 或域名白名单。";
      };
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>

  <!-- ── Nav ── -->
  <nav class="nav">
    <a class="nav-logo" href="#">
      <div class="nav-logo-icon">✈</div>
      <span>AI 旅行规划</span>
    </a>
    <span class="nav-title">Travel Planner</span>
    <div class="nav-spacer"></div>
    <button class="nav-btn" onclick="newChat()">+ 新对话</button>
    <button class="nav-btn">历史记录</button>
  </nav>

  <!-- ── Main Layout ── -->
  <div class="layout">

    <!-- ── Left: Chat ── -->
    <section class="chat-panel">
      <div class="chat-header">
        <div class="chat-header-title">
          <span class="dot"></span>
          AI 旅行规划助手
        </div>
        <div class="chat-header-sub">告诉我你的目的地，我来帮你规划行程 🗺️</div>
      </div>

      <div class="messages" id="messages">
        <!-- 初始欢迎消息 -->
        <div class="msg-row assistant">
          <div class="msg-avatar">✈</div>
          <div class="msg-bubble">
            <p>你好！我是你的 AI 旅行规划助手。😊</p>
            <p>告诉我你想去哪里、大概几天，我会帮你规划一份<strong>详细行程</strong>，并在右侧地图上展示路线。</p>
          </div>
        </div>
      </div>

      <!-- 快捷建议 -->
      <div class="suggestions" id="suggestions">
        <div class="suggestion-chip" onclick="sendSuggestion('我想去上海玩3天')">🏙️ 上海3天</div>
        <div class="suggestion-chip" onclick="sendSuggestion('北京4天亲子游')">🏯 北京4天</div>
        <div class="suggestion-chip" onclick="sendSuggestion('成都5天美食之旅')">🐼 成都5天</div>
        <div class="suggestion-chip" onclick="sendSuggestion('厦门2天海滨旅行')">🌊 厦门2天</div>
      </div>

      <!-- 输入区 -->
      <div class="input-area">
        <div class="input-row">
          <textarea
            id="user-input"
            class="input-box"
            placeholder="告诉我你的旅行计划，例如：我想去上海玩3天…"
            rows="1"
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="send-btn" onclick="sendMessage()" aria-label="发送">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">按 Enter 发送 · Shift+Enter 换行</div>
      </div>
    </section>

    <!-- ── Right: Map ── -->
    <section class="map-panel">
      <div class="map-toolbar">
        <span class="map-toolbar-title">🗺️ 路线地图</span>
        <div class="map-toolbar-spacer"></div>
        <div id="route-mode-controls"></div>
      </div>

      <!-- 地图容器 -->
      <div id="map-container"></div>

      <!-- 地图状态提示 -->
      <div id="map-status" class="status-box">等待行程规划中…</div>

      <!-- 地图占位（未加载数据时显示） -->
      <div class="map-placeholder" id="map-placeholder">
        <div class="map-placeholder-icon">🗺️</div>
        <div class="map-placeholder-text">
          在左侧告诉我你的旅行计划<br>地图将自动展示你的行程路线
        </div>
      </div>
    </section>

  </div>

  <!-- 地图组件 & Mock 数据 -->
  <script src="./map_UI/mock_map_payload.js"></script>
  <script src="./map_UI/map.js"></script>

  <script>
    /* ── Chat State ── */
    var isWaiting = false;

    /* ── Mock AI 响应（对接后端时替换此函数） ── */
    var MOCK_REPLIES = {
      "上海": {
        text: "好的！为你规划了一份**上海3天经典行程** 🏙️\n\n**第1天 — 经典地标**\n• 外滩 → 豫园 → 上海博物馆东馆\n\n**第2天 — 现代都市**\n• 陆家嘴 → 环球金融中心 → 新天地\n\n**第3天 — 文艺慢游**\n• 田子坊 → 武康路 → 衡山路\n\n预计总费用约 **¥2,500**，已在右侧地图标注路线！",
        useMap: true
      },
      "北京": {
        text: "好的！为你规划了一份**北京4天亲子行程** 🏯\n\n**第1天 — 故宫 & 天安门**\n• 天安门广场 → 故宫 → 景山公园\n\n**第2天 — 长城 & 颐和园**\n• 八达岭长城 → 颐和园\n\n**第3天 — 奥林匹克公园**\n• 鸟巢 → 水立方 → 奥森公园\n\n**第4天 — 文化体验**\n• 南锣鼓巷 → 后海 → 恭王府\n\n预计总费用约 **¥3,800**，右侧地图已标注路线！",
        useMap: false
      },
      "成都": {
        text: "好的！为你规划了一份**成都5天美食之旅** 🐼\n\n**第1天** — 宽窄巷子 & 锦里古街\n**第2天** — 都江堰 & 青城山\n**第3天** — 大熊猫基地\n**第4天** — 武侯祠 & 杜甫草堂\n**第5天** — IFS 逛街 & 夜市\n\n美食推荐：担担面、火锅、串串、钟水饺 🍜\n\n预计总费用约 **¥4,200**，右侧地图已标注路线！",
        useMap: false
      },
      "厦门": {
        text: "好的！为你规划了一份**厦门2天海滨行程** 🌊\n\n**第1天 — 鼓浪屿**\n• 厦门轮渡 → 日光岩 → 钢琴博物馆 → 皓月园\n\n**第2天 — 市区漫游**\n• 曾厝垵 → 南普陀寺 → 厦门大学 → 中山路步行街\n\n海鲜推荐：沙茶面、海蛎煎、土笋冻 🦪\n\n预计总费用约 **¥1,800**，右侧地图已标注路线！",
        useMap: false
      }
    };

    function getMockReply(text) {
      for (var key in MOCK_REPLIES) {
        if (text.indexOf(key) >= 0) return MOCK_REPLIES[key];
      }
      return {
        text: "好的，我来帮你规划行程！\n\n目前支持的城市：**上海、北京、成都、厦门、广州、深圳、杭州、西安、重庆、三亚**。\n\n请告诉我你想去哪个城市以及旅行天数，例如：「我想去上海玩3天」",
        useMap: false
      };
    }

    /* ── DOM helpers ── */
    function $(id) { return document.getElementById(id); }
    var messagesEl = $("messages");

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMessage(role, html) {
      var row = document.createElement("div");
      row.className = "msg-row " + role;

      var avatar = document.createElement("div");
      avatar.className = "msg-avatar";
      avatar.textContent = role === "assistant" ? "✈" : "我";

      var bubble = document.createElement("div");
      bubble.className = "msg-bubble";
      bubble.innerHTML = simpleMarkdown(html);

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollBottom();
      return row;
    }

    function showTyping() {
      var row = document.createElement("div");
      row.className = "msg-row assistant";
      row.id = "typing-row";
      var avatar = document.createElement("div");
      avatar.className = "msg-avatar";
      avatar.textContent = "✈";
      var ind = document.createElement("div");
      ind.className = "typing-indicator";
      ind.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      row.appendChild(avatar);
      row.appendChild(ind);
      messagesEl.appendChild(row);
      scrollBottom();
    }

    function removeTyping() {
      var el = $("typing-row");
      if (el) el.remove();
    }

    /* 简单的 Markdown → HTML 转换 */
    function simpleMarkdown(text) {
      return text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/\n\n/g, "</p><p>")
        .replace(/\n/g, "<br>")
        .replace(/^/, "<p>").replace(/$/, "</p>")
        .replace(/• /g, "• ");
    }

    /* ── 地图控制 ── */
    var mapLoaded = false;

    function showMap(payload) {
      var placeholder = $("map-placeholder");
      if (placeholder) placeholder.classList.add("hidden");

      if (window.__AMAP_LOAD_ERROR__) {
        $("map-status").textContent = window.__AMAP_LOAD_ERROR__;
        $("map-status").style.color = "#991b1b";
        return;
      }

      function tryRender() {
        if (!window.AMap || !window.renderTravelMap) {
          setTimeout(tryRender, 200);
          return;
        }
        window.renderTravelMap(payload, {
          containerId: "map-container",
          city: payload.city || "上海",
          modeSelector: "#route-mode-controls",
          statusSelector: "#map-status"
        });
        mapLoaded = true;
      }
      tryRender();
    }

    /* ── 发送消息 ── */
    function sendMessage() {
      if (isWaiting) return;
      var input = $("user-input");
      var text = input.value.trim();
      if (!text) return;

      // 隐藏建议 chips
      $("suggestions").style.display = "none";

      // 显示用户消息
      appendMessage("user", text);
      input.value = "";
      autoResize(input);

      isWaiting = true;
      showTyping();

      // 模拟网络延迟（对接后端时替换为 fetch）
      setTimeout(function () {
        removeTyping();
        var reply = getMockReply(text);
        appendMessage("assistant", reply.text);

        if (reply.useMap && window.mockMapPayload) {
          showMap(window.mockMapPayload);
          $("map-status").textContent = "行程已加载，点击标记查看详情";
        }

        isWaiting = false;
      }, 1200 + Math.random() * 600);
    }

    function sendSuggestion(text) {
      $("user-input").value = text;
      sendMessage();
    }

    /* ── 键盘事件 ── */
    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    /* ── 自动调整 textarea 高度 ── */
    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 120) + "px";
    }

    /* ── 新建对话 ── */
    function newChat() {
      messagesEl.innerHTML = "";
      appendMessage("assistant", "你好！我是你的 AI 旅行规划助手。😊\n\n告诉我你想去哪里、大概几天，我会帮你规划一份**详细行程**，并在右侧地图上展示路线。");
      $("suggestions").style.display = "flex";
      $("map-placeholder").classList.remove("hidden");
      $("map-status").textContent = "等待行程规划中…";
      $("map-status").style.color = "";
    }
  </script>
</body>
</html>
